<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Matching Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Google Font Setup */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
            touch-action: manipulation;
        }

        /* 3D Card Flip Perspective and Logic */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }

        /* Closed Box Styling */
        .card-front {
            background: linear-gradient(145deg, #3b82f6 0%, #1d4ed8 100%);
            border: 4px solid #60a5fa;
            box-shadow: 0 8px 16px -2px rgba(30, 58, 138, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-front:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -2px rgba(30, 58, 138, 0.35);
        }

        /* Opened Box Styling */
        .card-back {
            background: #ffffff;
            transform: rotateY(180deg);
            box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.1);
            border: 4px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
        }

        /* Matched Box Styling */
        .card.matched .card-back {
            border-color: #22c55e;
            background: #f0fdf4;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
        }

        /* Pop-in animation for "MATCH!" indicator */
        @keyframes popIn {
            0% { transform: scale(0.3) rotate(-5deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Canvas Overlay for Confetti */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-3 sm:p-4 text-slate-800 select-none">

    <!-- Confetti Overlay -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Header / Control Panel -->
    <header class="flex flex-wrap items-center justify-between gap-2 bg-white/85 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-md border border-white/60 shrink-0 z-10">
        <div class="flex items-center gap-3">
            <span class="text-3xl sm:text-4xl">✏️</span>
            <div>
                <h1 class="text-xl sm:text-2xl font-black bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent tracking-wide">
                    Stationery Matching Game
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 font-semibold">Touch to find matching pairs!</p>
            </div>
        </div>

        <!-- Toolbar Buttons -->
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Music Button -->
            <button id="btn-music" onclick="toggleMusic()" class="flex items-center gap-2 px-4 py-2.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl font-bold text-sm sm:text-base transition-all shadow-sm active:scale-95 border-2 border-amber-300 min-w-[120px] justify-center">
                <span id="music-icon">🎵</span>
                <span id="music-text">Music: OFF</span>
            </button>

            <!-- Restart Button -->
            <button onclick="restartGame()" class="flex items-center gap-2 px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-sm sm:text-base transition-all shadow-md hover:shadow-lg active:scale-95 border-2 border-emerald-400">
                <span>🔄</span>
                <span>Restart</span>
            </button>

            <!-- Fullscreen Button -->
            <button onclick="toggleFullscreen()" class="flex items-center gap-2 px-4 py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 rounded-xl font-bold text-sm sm:text-base transition-all shadow-sm active:scale-95 border-2 border-indigo-300">
                <span>🖥️</span>
                <span class="hidden sm:inline">Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- Main Game Area: Exactly TWO ROWS of SIX BOXES -->
    <main class="flex-1 my-2 flex items-center justify-center min-h-0 w-full">
        <div id="card-grid" class="w-full h-full max-w-7xl grid grid-rows-2 grid-cols-6 gap-2 sm:gap-4 p-1 sm:p-2">
            <!-- 12 Cards injected by JavaScript -->
        </div>
    </main>

    <!-- Temporary "MATCH!" Banner -->
    <div id="match-banner" class="fixed inset-0 pointer-events-none flex items-center justify-center z-50 hidden">
        <div class="animate-pop bg-yellow-400 border-4 border-yellow-200 text-amber-950 font-black text-4xl sm:text-6xl px-10 py-5 rounded-3xl shadow-2xl tracking-wider uppercase border-dashed flex items-center gap-3">
            <span>✨</span> MATCH! <span>✨</span>
        </div>
    </div>

    <!-- Game Script Logic -->
    <script>
        // -------------------------------------------------------------
        // Vocabulary & Data Definitions
        // -------------------------------------------------------------
        const VOCABULARY = [
            { id: 'book', image: 'book.png', sentence: 'It is my book.' },
            { id: 'pen', image: 'pen.png', sentence: 'It is my pen.' },
            { id: 'pencil', image: 'pencil.png', sentence: 'It is my pencil.' },
            { id: 'ruler', image: 'ruler.png', sentence: 'It is my ruler.' },
            { id: 'marker', image: 'marker.png', sentence: 'It is my marker.' },
            { id: 'eraser', image: 'eraser.png', sentence: 'It is my eraser.' }
        ];

        // -------------------------------------------------------------
        // Game State Variables
        // -------------------------------------------------------------
        let cardsData = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let isEvaluating = false;
        let audioCtx = null;
        let musicPlaying = false;
        let musicOscillators = [];
        let musicInterval = null;

        // -------------------------------------------------------------
        // Audio Engine (Web Audio API Synthesizer)
        // -------------------------------------------------------------
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Correct match pleasant chime sound
        function playChimeSound() {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.45);
            });
        }

        // Incorrect match short buzzing sound
        function playBuzzSound() {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.25);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        // Continuous Background Music Generator strictly locked at 10% volume
        function toggleMusic() {
            initAudio();
            musicPlaying = !musicPlaying;

            const btnText = document.getElementById('music-text');
            const btnIcon = document.getElementById('music-icon');

            if (musicPlaying) {
                btnText.textContent = 'Music: ON';
                btnIcon.textContent = '🎶';
                startBackgroundMusic();
            } else {
                btnText.textContent = 'Music: OFF';
                btnIcon.textContent = '🎵';
                stopBackgroundMusic();
            }
        }

        function startBackgroundMusic() {
            stopBackgroundMusic();
            if (!audioCtx) return;

            // Pentatonic upbeat melody sequence
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 392.00, 329.63];
            let noteIdx = 0;

            musicInterval = setInterval(() => {
                if (!musicPlaying || !audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);

                // STRICT volume cap at 10% (0.1 max amplitude)
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.38);

                noteIdx = (noteIdx + 1) % notes.length;
            }, 400);
        }

        function stopBackgroundMusic() {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }

        // -------------------------------------------------------------
        // Confetti Engine
        // -------------------------------------------------------------
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            particles = [];
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ec4899'];
            
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 18,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 10 + 6,
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10,
                    life: 1
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;

            particles.forEach(p => {
                if (p.life > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4; // gravity
                    p.life -= 0.015;
                    p.rotation += p.rSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                }
            });

            if (active) {
                requestAnimationFrame(updateConfetti);
            } else {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        // -------------------------------------------------------------
        // Core Game Logic
        // -------------------------------------------------------------
        function initGame() {
            // Duplicate the 6 vocabulary items into 12 cards (6 pairs)
            const deck = [...VOCABULARY, ...VOCABULARY];
            
            // Randomize card positions (Fisher-Yates Shuffle)
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            cardsData = deck.map((item, index) => ({
                id: index,
                number: index + 1, // 1 to 12
                vocabId: item.id,
                image: item.image,
                sentence: item.sentence,
                isFlipped: false,
                isMatched: false
            }));

            selectedCards = [];
            matchedPairs = 0;
            isEvaluating = false;

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';

            cardsData.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 w-full h-full cursor-pointer';
                cardEl.id = `card-${card.id}`;
                
                cardEl.onclick = () => handleCardClick(card.id);

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <!-- Front View: Closed Box with Box Number (1-12) -->
                        <div class="card-front">
                            <span class="text-white text-3xl sm:text-5xl lg:text-6xl font-black drop-shadow-md">
                                ${card.number}
                            </span>
                        </div>
                        <!-- Back View: Revealed Picture + Sentence -->
                        <div class="card-back">
                            <div class="flex-1 w-full flex items-center justify-center overflow-hidden p-1">
                                <img src="${card.image}" 
                                     alt="${card.vocabId}" 
                                     class="max-h-full max-w-full object-contain filter drop-shadow"
                                     onerror="this.onerror=null; this.src='https://placehold.co/200x200/e2e8f0/475569?text=${card.vocabId}';">
                            </div>
                            <div id="sentence-${card.id}" class="w-full text-center py-1 px-1 bg-emerald-100 border border-emerald-300 rounded-lg hidden transition-all">
                                <p class="text-emerald-950 font-black text-xs sm:text-sm md:text-base leading-tight">
                                    ${card.sentence}
                                </p>
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(cardEl);
            });
        }

        function handleCardClick(id) {
            initAudio();
            const card = cardsData[id];

            // Prevent selection if already evaluating, card is already flipped, or matched
            if (isEvaluating || card.isFlipped || card.isMatched || selectedCards.length >= 2) {
                return;
            }

            // Flip selected card
            flipCard(card, true);
            selectedCards.push(card);

            // When two cards are chosen, evaluate
            if (selectedCards.length === 2) {
                isEvaluating = true;
                setTimeout(evaluateMatch, 400);
            }
        }

        function flipCard(card, flipped) {
            card.isFlipped = flipped;
            const cardEl = document.getElementById(`card-${card.id}`);
            if (cardEl) {
                if (flipped) {
                    cardEl.classList.add('flipped');
                } else {
                    cardEl.classList.remove('flipped');
                }
            }
        }

        function evaluateMatch() {
            const [card1, card2] = selectedCards;

            if (card1.vocabId === card2.vocabId) {
                // Correct Match
                card1.isMatched = true;
                card2.isMatched = true;

                document.getElementById(`card-${card1.id}`).classList.add('matched');
                document.getElementById(`card-${card2.id}`).classList.add('matched');

                // Reveal Sentences Underneath
                document.getElementById(`sentence-${card1.id}`).classList.remove('hidden');
                document.getElementById(`sentence-${card2.id}`).classList.remove('hidden');

                // Effects
                playChimeSound();
                triggerConfetti();
                showMatchBanner();

                matchedPairs++;
                selectedCards = [];
                isEvaluating = false;

            } else {
                // Incorrect Match
                playBuzzSound();

                // Wait 1.5 seconds before turning back down
                setTimeout(() => {
                    flipCard(card1, false);
                    flipCard(card2, false);
                    selectedCards = [];
                    isEvaluating = false;
                }, 1500);
            }
        }

        function showMatchBanner() {
            const banner = document.getElementById('match-banner');
            banner.classList.remove('hidden');
            setTimeout(() => {
                banner.classList.add('hidden');
            }, 1000);
        }

        function restartGame() {
            initGame();
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Initialize Game on Load
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
